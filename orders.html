<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Orders & Carbon Tracking — EcoMart</title>
    <meta name="description" content="Track your active carbon-neutral deliveries and view past eco impact receipts." />
    
    <!-- Google Fonts & Style Engine -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                900: '#112419',
                800: '#1b3b2b',
                700: '#254d37',
                600: '#2d5a40',
                500: '#3a7253',
                400: '#4a8b67',
                100: '#eef4f0',
                50:  #f5f9f6',
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/frontend/css/style.css">
  </head>
  <body class="bg-[#fcfbf7] text-[#18221c] min-h-screen flex flex-col font-sans antialiased">

    <!-- Sticky Header Navigation -->
    <nav class="header-glass sticky top-0 z-50 border-b border-[#e8e5de]">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-20">
          
          <a href="/" class="flex items-center gap-3 group">
            <div class="w-10 h-10 rounded-xl bg-[#2d5a40] text-white flex items-center justify-center shadow-md group-hover:bg-[#1b3b2b] transition">
              <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.055 11H5a2 2 0 012 2v1a2 2 0 002 2 2 2 0 012 2v2.945M8 3.935V5.5A2.5 2.5 0 0010.5 8h.5a2 2 0 012 2 2 2 0 104 0 2 2 0 012-2h1.064M15 20.488V18a2 2 0 012-2h3.064M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
              </svg>
            </div>
            <div>
              <span class="font-extrabold text-2xl tracking-tight text-[#1b3b2b]">Eco<span class="text-[#3a7253]">Mart</span></span>
              <p class="text-[10px] text-slate-500 font-semibold tracking-wider uppercase leading-none">Shop Better. Live Greener.</p>
            </div>
          </a>

          <div class="hidden lg:flex items-center space-x-8 text-xs font-bold uppercase tracking-wider text-slate-700">
            <a href="/" class="hover:text-[#2d5a40] transition">Home</a>
            <a href="/products.html" class="hover:text-[#2d5a40] transition">Shop Catalog</a>
            <a href="/wishlist.html" class="hover:text-[#2d5a40] transition">Wishlist</a>
            <a href="/orders.html" class="text-[#2d5a40] font-extrabold border-b-2 border-[#2d5a40] pb-1">My Orders</a>
          </div>

          <div class="flex items-center gap-3">
            <a href="/wishlist.html" class="p-2 text-slate-600 hover:text-rose-600 hover:bg-rose-50 rounded-lg transition relative" title="Saved Wishlist">
              <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z" />
              </svg>
              <span class="wishlist-badge absolute top-1 right-1 bg-rose-500 text-white text-[10px] font-extrabold w-4 h-4 flex items-center justify-center rounded-full hidden">0</span>
            </a>

            <div id="nav-auth-container" class="flex items-center gap-2">
              <a href="/login.html" class="text-slate-700 hover:text-[#2d5a40] font-bold text-xs uppercase tracking-wider px-3 py-2 transition">Login</a>
              <a href="/register.html" class="btn-primary py-2 px-4 text-xs">Sign Up</a>
            </div>

            <a href="/checkout.html" class="relative btn-primary py-2 px-3.5 bg-[#1b3b2b] hover:bg-[#112419] flex items-center gap-2" title="Shopping Cart">
              <svg class="w-5 h-5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
              </svg>
              <span class="hidden sm:inline font-bold text-xs uppercase">Cart</span>
              <span id="cart-badge" class="bg-emerald-500 text-slate-950 text-[11px] font-black w-5 h-5 flex items-center justify-center rounded-full ml-0.5">0</span>
            </a>
          </div>

        </div>
      </div>
    </nav>

    <!-- Main Orders View -->
    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10 flex-grow w-full">
      
      <div class="mb-8 flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
        <div>
          <h1 class="text-3xl font-extrabold text-[#1b3b2b] tracking-tight">Order History & Tracking</h1>
          <p class="text-sm text-slate-600 mt-1">Track active deliveries and review past eco impact certificates.</p>
        </div>
        <a href="/products.html" class="btn-secondary text-xs py-2.5 px-4">+ Continue Shopping</a>
      </div>

      <div id="orders-container" class="space-y-6">
        <!-- Dynamically populated via orders.js -->
      </div>

    </main>

    <!-- Footer -->
    <footer class="bg-slate-950 text-slate-400 py-12 border-t border-slate-900 mt-16">
      <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 text-center text-xs text-slate-500">
        <p>&copy; 2026 EcoMart. All rights reserved.</p>
      </div>
    </footer>

    <!-- Core Scripts -->
    <script src="/frontend/js/cart.js"></script>
    <script src="/frontend/js/wishlist.js"></script>
    <script src="/frontend/js/nav-auth.js"></script>
    <script src="/frontend/js/orders.js"></script>
  </body>
</html>
