<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign In — EcoMart</title>
    <meta name="description" content="Sign in to your EcoMart account to access carbon tracking and order history." />
    
    <!-- Google Fonts & Style Engine -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brand: {
                900: '#112419',
                800: '#1b3b2b',
                700: '#254d37',
                600: '#2d5a40',
                500: '#3a7253',
                400: '#4a8b67',
                100: '#eef4f0',
                50:  #f5f9f6',
              }
            }
          }
        }
      }
    </script>
    <link rel="stylesheet" href="/frontend/css/style.css">
  </head>
  <body class="bg-[#fcfbf7] text-[#18221c] min-h-screen flex flex-col justify-between font-sans antialiased">

    <!-- Minimal Header -->
    <header class="py-6 px-8 flex justify-between items-center max-w-7xl mx-auto w-full">
      <a href="/" class="flex items-center gap-3">
        <div class="w-9 h-9 rounded-xl bg-[#2d5a40] text-white flex items-center justify-center font-bold shadow-md">
          🌱
        </div>
        <span class="font-extrabold text-2xl tracking-tight text-[#1b3b2b]">Eco<span class="text-[#3a7253]">Mart</span></span>
      </a>
      <a href="/register.html" class="text-xs font-bold text-[#2d5a40] hover:underline">Don't have an account? Sign Up →</a>
    </header>

    <!-- Login Centered Card -->
    <main class="w-full max-w-md mx-auto px-4 py-8">
      <div class="eco-card p-8 bg-white border border-[#e8e5de] shadow-lg">
        
        <div class="text-center mb-8">
          <span class="badge-eco-score mb-2">🌿 Sustainable E-Commerce</span>
          <h1 class="text-2xl font-extrabold text-[#1b3b2b] tracking-tight">Welcome Back</h1>
          <p class="text-xs text-slate-500 mt-1">Sign in to track orders and manage carbon offset rewards.</p>
        </div>

        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Email Address:</label>
            <input type="email" id="email" required placeholder="user@ecomart.org" class="w-full bg-[#fcfbf7] border border-[#e8e5de] rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#2d5a40]">
          </div>

          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-xs font-bold uppercase tracking-wider text-slate-700">Password:</label>
              <button type="button" onclick="openForgotPasswordModal()" class="text-xs font-bold text-[#2d5a40] hover:underline">
                Forgot Password?
              </button>
            </div>
            <input type="password" id="password" required placeholder="••••••••" class="w-full bg-[#fcfbf7] border border-[#e8e5de] rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#2d5a40]">
          </div>

          <div id="error-message" class="hidden text-xs text-red-600 bg-red-50 p-3 rounded-lg border border-red-200"></div>

          <button type="submit" class="btn-primary w-full py-3 text-sm shadow-md">
            Sign In to Account →
          </button>
        </form>

      </div>
    </main>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="fixed inset-0 z-[60] hidden flex items-center justify-center p-4">
      <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" onclick="closeForgotPasswordModal()"></div>
      <div class="relative bg-white rounded-2xl shadow-2xl w-full max-w-md p-6 space-y-4">
        <div class="flex justify-between items-center border-b border-slate-100 pb-3">
          <h3 class="font-extrabold text-lg text-[#1b3b2b]">Reset Your Password</h3>
          <button type="button" onclick="closeForgotPasswordModal()" class="text-slate-400 hover:text-slate-600 font-bold">✕</button>
        </div>
        <p class="text-xs text-slate-600">Enter your account email address below to receive password reset instructions.</p>
        <form id="forgot-password-form" onsubmit="handleForgotPassword(event)" class="space-y-4">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-slate-700 mb-1">Email Address:</label>
            <input type="email" id="forgot-email" required placeholder="your.email@example.com" class="w-full bg-[#fcfbf7] border border-[#e8e5de] rounded-lg p-3 text-sm focus:outline-none focus:ring-2 focus:ring-[#2d5a40]">
          </div>
          <div id="forgot-message" class="hidden text-xs p-3 rounded-lg"></div>
          <div class="flex justify-end gap-2 pt-2">
            <button type="button" onclick="closeForgotPasswordModal()" class="px-4 py-2 text-xs font-bold text-slate-600 hover:bg-slate-100 rounded-lg">Cancel</button>
            <button type="submit" class="btn-primary px-5 py-2 text-xs font-bold">Send Reset Link</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Footer -->
    <footer class="py-6 text-center text-xs text-slate-400">
      <p>&copy; 2026 EcoMart. Shop Better. Live Greener.</p>
    </footer>

    <!-- Core Scripts -->
    <script src="/frontend/js/cart.js"></script>
    <script src="/frontend/js/auth.js"></script>
    <script>
      function openForgotPasswordModal() {
        document.getElementById('forgot-modal').classList.remove('hidden');
        document.getElementById('forgot-email').value = document.getElementById('email').value || '';
        const msg = document.getElementById('forgot-message');
        if (msg) { msg.classList.add('hidden'); msg.textContent = ''; }
      }

      function closeForgotPasswordModal() {
        document.getElementById('forgot-modal').classList.add('hidden');
      }

      async function handleForgotPassword(e) {
        e.preventDefault();
        const email = document.getElementById('forgot-email').value;
        const msg = document.getElementById('forgot-message');
        if (!email) return;

        msg.className = 'text-xs p-3 rounded-lg bg-emerald-50 text-emerald-800 border border-emerald-200 block';
        msg.textContent = `A password reset link has been sent to ${email}. Please check your inbox!`;
        
        setTimeout(() => {
          closeForgotPasswordModal();
        }, 3000);
      }
    </script>
  </body>
</html>
